name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n start.sh start-options.sh install-utils.sh runtime-utils.sh render-start-script.sh render-admins.sh tests/test-render-start-script.sh tests/test-render-admins.sh tests/test-start-options.sh tests/test-install-utils.sh tests/test-runtime-utils.sh tests/test-startup-reliability.sh
          bash tests/test-render-start-script.sh
          bash tests/test-render-admins.sh
          bash tests/test-start-options.sh
          bash tests/test-install-utils.sh
          bash tests/test-runtime-utils.sh
          bash tests/test-startup-reliability.sh

      - name: Validate Unraid template XML
        run: python3 -c 'import xml.etree.ElementTree as ET; ET.parse("templates/RunningWithRifles.xml")'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/skullrider0/rwr-unraid
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
